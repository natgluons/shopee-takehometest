[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-ai"
version = "0.1.0"
description = "Receipt intelligence platform with OCR, SQLite persistence, a self-hosted vector store, and AI query tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Receipt AI maintainers" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "pillow>=10.0,<12.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
]
test = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
]
dev = [
    "ruff>=0.4,<1.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
receipt-ai-analyze = "receipt_ai.csv_analysis.cli:main"
receipt-ai-stream = "receipt_ai.streaming.cli:main"
receipt-ai-serve = "receipt_ai.api.main:run"

[project.urls]
Homepage = "https://example.com/receipt-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
receipt_ai = ["ui/templates/*.html", "ui/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PT",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests that exercise the API",
    "docker: tests that require a running Docker daemon",
    "slow: tests that process large datasets",
]

[tool.coverage.run]
source = ["receipt_ai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
