name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,analysis]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            .pytest_cache
          if-no-files-found: ignore


  docker-build:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t receipt-ai:ci .

      - name: Start container
        run: |
          docker run -d --name receipt-ai-ci -p 8000:8000 \
            -e OPENAI_API_KEY= \
            receipt-ai:ci

      - name: Wait for health and verify readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "Application is healthy after $attempt attempts"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          curl -fsS http://127.0.0.1:8000/api/tools >/dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker logs receipt-ai-ci

      - name: Stop container
        if: always()
        run: docker rm -f receipt-ai-ci
